name: Release do cliente

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Conferir a versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cat VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com VERSION ($version)." >&2
            echo "Rode ./scripts/set-version.sh X.Y.Z e refaça a tag." >&2
            exit 1
          fi

      - name: Dependências e testes do backend
        working-directory: backend
        env:
          OPENAI_API_KEY: ""
        run: |
          uv sync --extra dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - name: Dependências e testes do cliente
        working-directory: desktop
        run: |
          uv sync --extra dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - name: Ferramentas de empacotamento
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev libfuse2
          curl -fsSL -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage

      - name: Gerar AppImage e .deb
        env:
          APPIMAGETOOL: /tmp/appimagetool.AppImage
        run: |
          ./scripts/build-appimage.sh
          ./scripts/build-deb.sh
          cd dist
          sha256sum ./*.AppImage ./*.deb > sha256sums.txt
          ls -lh

      - name: Guardar artefatos (build manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vb-typer-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/sha256sums.txt
          if-no-files-found: error

      - name: Publicar a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VB Typer ${{ github.ref_name }}
          body: |
            ## Instalação

            **Linux Mint/Ubuntu (recomendado):** baixe o `.deb`, dê dois cliques
            e instale pelo Gerenciador de Arquivos/GDebi. Abra o **VB Typer** no
            menu: no primeiro uso ele pede o endereço e o token da API.

            **AppImage (portátil):** baixe o `.AppImage`, permita a execução
            (Propriedades → Permissões) e abra. No primeiro uso, deixe marcado
            **Iniciar com o sistema**: no AppImage isso também cria o item de
            menu e copia o arquivo para um caminho estável.
            Em distribuições novas pode ser necessário instalar `libfuse2`.

            O cliente inicia com o sistema (XDG autostart) e o token fica só na
            sua máquina, em `~/.config/vb-typer/api-token` (0600).

            Confira os arquivos com `sha256sum -c sha256sums.txt`.
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/sha256sums.txt
          fail_on_unmatched_files: true
