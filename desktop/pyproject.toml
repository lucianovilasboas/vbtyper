[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vb-typer-desktop"
version = "0.20.0"
description = "Cliente desktop do VB Typer: ditado por atalho global usando a API REST local."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luciano" }]
keywords = ["dictation", "voice", "x11", "vb-typer"]

dependencies = [
    "httpx>=0.27",
    "python-xlib>=0.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.7",
]
# Só para o AppImage: `scripts/build-appimage.sh` usa `uv run --extra build`.
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
vb-typer-desktop = "vb_typer_desktop.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vb_typer_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# `tray/tray_helper.py` é cópia fiel do app 1.x (processo GTK3 separado); não é
# formatado aqui para o arquivo seguir idêntico ao original. O `tray/indicator.py`
# é nosso e é verificado normalmente.
extend-exclude = ["tray/tray_helper.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["vb_typer_desktop"]
