[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vb-typer"
version = "0.20.1"
description = "Backend desacoplado do VB Typer: API REST local para transcrição de áudio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luciano" }]
keywords = ["transcription", "openai", "fastapi", "dictation", "vb-typer"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "keyring>=25.4",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "asgi-lifespan>=2.1",
    "ruff>=0.7",
]

[project.scripts]
vb-typer-api = "vb_typer.__main__:main"
vb-typer-import = "vb_typer.cli.import_history:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vb_typer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::UserWarning:starlette.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["vb_typer"]
