# Configuração do Alembic para uso manual (`alembic revision`, `alembic upgrade`).
# A aplicação roda as migrações programaticamente via `vb_typer.db.migrate`.
[alembic]
script_location = src/vb_typer/db/migrations
prepend_sys_path = src
path_separator = os
sqlalchemy.url = sqlite+pysqlite:///./vb-typer.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
