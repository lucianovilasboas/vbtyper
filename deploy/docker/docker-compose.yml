# VB Typer 2.0 — API + interface web.
#
# Uso: cd deploy/docker && cp .env.example .env && docker compose up -d --build
# Ver o README.md desta pasta para o acesso pela ZeroTier, backup e atualização.

name: vb-typer

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: vb-typer-api:local
    restart: unless-stopped

    environment:
      # Invariante 7: o banco guarda horário local. O container nasce em UTC,
      # então o fuso precisa ser declarado (o systemd já herda o do host).
      TZ: "${VB_TYPER_TZ:-America/Sao_Paulo}"

    env_file:
      # Padrão: o `.env` ao lado deste arquivo. `VB_TYPER_ENV_FILE` permite
      # manter o arquivo de segredos fora do repositório (ex.: /etc/vb-typer/env)
      # — necessário em disco onde chmod não vale (NTFS, por exemplo).
      - "${VB_TYPER_ENV_FILE:-.env}"

    ports:
      # Publica SOMENTE numa interface (padrão: loopback). Aponte
      # VB_TYPER_BIND_ADDR para o endereço da ZeroTier no host. Nunca 0.0.0.0:
      # ainda não há login, e quem alcança "/" recebe um cookie de sessão válido.
      - "${VB_TYPER_BIND_ADDR:-127.0.0.1}:${VB_TYPER_BIND_PORT:-8765}:8765"

    volumes:
      # Banco (vb-typer.db) e áudios (audio/) — sem volume, cada "up" perde tudo.
      - vb-typer-data:/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/v1/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  # Nome fixo para o volume não ganhar o prefixo do projeto (facilita o backup).
  vb-typer-data:
    name: vb-typer-data
